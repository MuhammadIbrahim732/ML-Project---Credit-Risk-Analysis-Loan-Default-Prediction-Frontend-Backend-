<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Credit Risk Assessment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="top">
      <h1>Credit risk assessment</h1>
      <p>Enter the loan application details and get a default risk estimate from the model.</p>
    </header>

    <div class="layout">
      <form id="form" class="card form" novalidate>
        <fieldset>
          <legend>Applicant</legend>
          <div class="grid">
            <label>Age
              <input type="number" name="person_age" min="18" max="100" value="28" required>
            </label>
            <label>Annual income ($)
              <input type="number" name="person_income" min="1" step="any" value="55000" required>
            </label>
            <label>Home ownership
              <select name="person_home_ownership">
                <option value="RENT">Rent</option>
                <option value="OWN">Own</option>
                <option value="MORTGAGE">Mortgage</option>
                <option value="OTHER">Other</option>
              </select>
            </label>
            <label>Employment length (years)
              <input type="number" name="person_emp_length" min="0" step="any" value="4" required>
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Loan</legend>
          <div class="grid">
            <label>Purpose
              <select name="loan_intent">
                <option value="PERSONAL">Personal</option>
                <option value="EDUCATION">Education</option>
                <option value="MEDICAL">Medical</option>
                <option value="VENTURE">Venture</option>
                <option value="HOMEIMPROVEMENT">Home improvement</option>
                <option value="DEBTCONSOLIDATION">Debt consolidation</option>
              </select>
            </label>
            <label>Loan grade
              <select name="loan_grade">
                <option>A</option><option selected>B</option><option>C</option>
                <option>D</option><option>E</option><option>F</option><option>G</option>
              </select>
            </label>
            <label>Loan amount ($)
              <input type="number" name="loan_amnt" min="1" step="any" value="10000" required>
            </label>
            <label>Interest rate (%)
              <input type="number" name="loan_int_rate" min="0" step="any" value="11.5" required>
            </label>
            <label class="wide">Loan as share of income
              <input type="number" name="loan_percent_income" readonly tabindex="-1">
              <span class="hint">Calculated from loan amount and income</span>
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Credit history</legend>
          <div class="grid">
            <label>Previous default on file
              <div class="seg" role="radiogroup" aria-label="Previous default on file">
                <input type="radio" id="def-n" name="cb_person_default_on_file" value="N" checked>
                <label for="def-n">No</label>
                <input type="radio" id="def-y" name="cb_person_default_on_file" value="Y">
                <label for="def-y">Yes</label>
              </div>
            </label>
            <label>History length (years)
              <input type="number" name="cb_person_cred_hist_length" min="0" step="1" value="5" required>
            </label>
          </div>
        </fieldset>

        <div class="actions">
          <button type="submit" id="submit" class="primary"><span class="label">Assess risk</span><span class="spinner" aria-hidden="true"></span></button>
        </div>
      </form>

      <aside class="card result" id="result" data-state="idle" aria-live="polite">
        <svg class="gauge" viewBox="0 0 240 140" role="img" aria-label="Default probability gauge">
          <path class="track" d="M 20 120 A 100 100 0 0 1 220 120" pathLength="100"/>
          <path class="arc" id="arc" d="M 20 120 A 100 100 0 0 1 220 120" pathLength="100"/>
          <line class="tick" id="tick" x1="0" y1="0" x2="0" y2="0"/>
        </svg>
        <div class="readout">
          <div class="pct"><span id="pct">--</span><small>%</small></div>
          <div class="sub">probability of default</div>
        </div>

        <div class="badge" id="badge">Awaiting input</div>

        <dl class="facts">
          <div><dt>Decision threshold</dt><dd id="threshold">--</dd></div>
          <div><dt>Model decision</dt><dd id="decision">--</dd></div>
        </dl>

        <p class="note" id="note">Fill in the application and select <b>Assess risk</b>.</p>
      </aside>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
